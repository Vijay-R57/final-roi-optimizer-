services:
  - type: web
    name: final-roi-optimizer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npx --no-install vite build && cd .."
    startCommand: "python start.py"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.0
